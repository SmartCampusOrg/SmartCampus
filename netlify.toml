[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/wu-sync"
  to = "/.netlify/functions/wu-sync"
  status = 200

[[redirects]]
  from = "/api/feed"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/api/harmonogram/*"
  to = "https://wu.pansim.edu.pl/wsrest/rest/phz/harmonogram/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
